services:
  - type: web
    name: crypto-paper-trading-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SYMBOL
        sync: false   # set in Render dashboard (default BTCUSDT if unset)
      - key: INTERVAL
        sync: false
      - key: POLL_SECONDS
        sync: false
      - key: STARTING_CASH
        sync: false
